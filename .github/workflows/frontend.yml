# Frontend: confere (lint, testes, build e testes ponta a ponta) em Pull Requests para a homologacao e a main e,
# quando algo chega na main (ou alguém aciona à mão na aba Actions), publica no Firebase Hosting.
# Configuração necessária (uma vez, por quem administra o repositório): ver "Deploy automático do frontend" no DEPLOY.md.
name: Frontend

on:
  pull_request:
    branches: [homologacao, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  # Botão "Run workflow" na aba Actions: publica de novo a main sem precisar de um commit novo.
  workflow_dispatch:

jobs:
  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  ponta-a-ponta:
    name: Testes ponta a ponta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Sem backend, sem Supabase e sem segredo: os testes respondem as chamadas (frontend/e2e/apoio).
      - name: Rodar os testes ponta a ponta
        run: npm run e2e

      - name: Guardar o relatório se algum teste falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-ponta-a-ponta
          path: frontend/playwright-report/
          retention-days: 7

  publicar:
    name: Publicar no Firebase Hosting
    # Só depois do merge na main, nunca em Pull Request.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [qualidade, ponta-a-ponta]
    runs-on: ubuntu-latest
    # Um deploy de cada vez: dois merges seguidos não se atropelam.
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci
        working-directory: frontend

      # O predeploy do firebase.json roda o build; as variáveis VITE_* entram aqui, no build (são públicas por desenho).
      - name: Publicar
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fisiotech-3b4ad
          channelId: live
          entryPoint: frontend
