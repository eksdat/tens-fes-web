spring:
  application:
    name: fisiotech-api
  main:
    log-startup-info: false
  config:
    import: optional:file:.env[.properties]
  datasource:
    hikari:
      maximum-pool-size: 3
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256
          audiences: authenticated

springdoc:
  # Documentação da API desligada por padrão (produção). Localmente: SWAGGER_ENABLED=true no .env.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  # O Render define PORT; localmente fica 8080.
  port: ${PORT:8080}
  # O Render termina o TLS e repassa HTTP; sem isso o Spring Security nunca envia o HSTS.
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%5p) %clr(%-24.24logger{0}){cyan} %m%n%wEx"
  level:
    root: WARN
    br.unibh: INFO
    org.flywaydb.core.internal.command.DbMigrate: INFO
    org.hibernate.orm.connections.pooling: WARN
    org.springdoc.core.events: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health
